<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid slice">
<title>Rolling thunderclouds, rain and lightning</title>
<defs><linearGradient id="cloud" x2="0" y2="1"><stop stop-color="#7a83b0" stop-opacity=".48"/><stop offset="1" stop-color="#202a42" stop-opacity="0"/></linearGradient><g id="cloudbank"><path d="M-150 65Q-145 0-90 8Q-62-45-10-5Q45-40 77 5Q138-12 155 65Z" fill="url(#cloud)"/></g><path id="drop" d="M0-10Q-5 0 0 3Q5 0 0-10" fill="#a7d4f4"/><g id="bolt"><path d="M24 0L-5 65H15L-18 122L-2 78H-24Z" fill="#96b9ff" opacity=".2" stroke="#a5caff" stroke-width="9"/><path d="M24 0L-5 65H15L-18 122L-2 78H-24Z" fill="#e5efff"/></g></defs>
<style>.clouds{animation:clouds 9s ease-in-out infinite alternate}.rain{animation:rain .95s linear infinite;opacity:.5}.lightning{animation:flash 6s linear infinite;opacity:0}@keyframes clouds{to{transform:translate(40px,8px)}}@keyframes rain{from{transform:translate(25px,-40px)}to{transform:translate(-30px,120px)}}@keyframes flash{0%,66%,70%,75%,100%{opacity:0}67%,72%{opacity:.9}68%,73%{opacity:.2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.lightning{opacity:.15}}
</style>
