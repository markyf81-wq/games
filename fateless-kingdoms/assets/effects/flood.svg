<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid slice">
<title>Rolling floodwater, foam and rising bubbles</title>
<defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#5ecbdf" stop-opacity=".12"/><stop offset="1" stop-color="#327dac" stop-opacity=".5"/></linearGradient><g id="bubble" fill="none" stroke="#a9ebf4" stroke-width="1.5"><circle r="5"/><path d="M-3-1Q-2-4 1-3"/></g></defs>
<style>.wave-a{animation:wave 6s ease-in-out infinite alternate}.wave-b{animation:wave 8s ease-in-out infinite alternate-reverse}.bubble{animation:rise 5s ease-in infinite}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4s ease-out infinite}@keyframes wave{to{transform:translate(-65px,-8px)}}@keyframes rise{0%{transform:translateY(25px);opacity:0}30%{opacity:.5}100%{transform:translate(20px,-90px);opacity:0}}@keyframes ripple{from{transform:scale(.5);opacity:.5}to{transform:scale(1.6);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.lightning{opacity:.15}}
</style>
<rect width="1000" height="220" fill="#286e91" opacity=".1"/><path class="wave-a" d="M-100 125Q0 75 100 125T300 125T500 125T700 125T900 125T1100 125V240H-100Z" fill="url(#water)"/><path class="wave-b" d="M-100 157Q0 115 100 157T300 157T500 157T700 157T900 157T1100 157V240H-100Z" fill="url(#water)"/><g class="wave-a" fill="none" stroke="#a5e8ef" opacity=".3"><path d="M-100 158Q0 110 100 158T300 158T500 158T700 158T900 158T1100 158" stroke-width="3"/><path d="M-70 191Q30 150 130 191T330 191T530 191T730 191T930 191T1130 191" stroke-width="1.5"/></g><g transform="translate(40 170) scale(0.7)"><g class="bubble" style="animation-delay:0.0s"><use href="#bubble"/></g></g><g transform="translate(131 170) scale(1.0499999999999998)"><g class="bubble" style="animation-delay:-0.7s"><use href="#bubble"/></g></g><g transform="translate(222 170) scale(1.4)"><g class="bubble" style="animation-delay:-1.4s"><use href="#bubble"/></g></g><g transform="translate(313 170) scale(0.7)"><g class="bubble" style="animation-delay:-2.0999999999999996s"><use href="#bubble"/></g></g><g transform="translate(404 170) scale(1.0499999999999998)"><g class="bubble" style="animation-delay:-2.8s"><use href="#bubble"/></g></g><g transform="translate(495 170) scale(1.4)"><g class="bubble" style="animation-delay:-3.5s"><use href="#bubble"/></g></g><g transform="translate(586 170) scale(0.7)"><g class="bubble" style="animation-delay:-4.199999999999999s"><use href="#bubble"/></g></g><g transform="translate(677 170) scale(1.0499999999999998)"><g class="bubble" style="animation-delay:-4.8999999999999995s"><use href="#bubble"/></g></g><g transform="translate(768 170) scale(1.4)"><g class="bubble" style="animation-delay:-5.6s"><use href="#bubble"/></g></g><g transform="translate(859 170) scale(0.7)"><g class="bubble" style="animation-delay:-6.3s"><use href="#bubble"/></g></g><g transform="translate(950 170) scale(1.0499999999999998)"><g class="bubble" style="animation-delay:-7.0s"><use href="#bubble"/></g></g><g transform="translate(1041 170) scale(1.4)"><g class="bubble" style="animation-delay:-7.699999999999999s"><use href="#bubble"/></g></g><ellipse class="ripple" cx="170" cy="166" rx="38" ry="8" fill="none" stroke="#b3eff0" style="animation-delay:0.0s"/><ellipse class="ripple" cx="490" cy="195" rx="38" ry="8" fill="none" stroke="#b3eff0" style="animation-delay:-1.3s"/><ellipse class="ripple" cx="800" cy="155" rx="38" ry="8" fill="none" stroke="#b3eff0" style="animation-delay:-2.6s"/>
</svg>
