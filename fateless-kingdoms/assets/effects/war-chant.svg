<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid slice">
<title>War banners, battle flames and rising embers</title>
<defs><radialGradient id="heat"><stop stop-color="#ffc34e" stop-opacity=".25"/><stop offset="1" stop-color="#c76a18" stop-opacity="0"/></radialGradient><linearGradient id="fire" x2="0" y2="1"><stop stop-color="#ffe18b"/><stop offset=".5" stop-color="#eeb24a"/><stop offset="1" stop-color="#bb5a23" stop-opacity=".1"/></linearGradient><g id="flame"><path d="M0 0C-22-15-7-31-9-48C13-33 1-23 11-18Q12-36 21-41C16-17 30-6 15 0Z" fill="url(#fire)"/></g><g id="banner"><path d="M-25-60H25V13L0-3L-25 13Z" fill="#b89137" opacity=".2" stroke="#e9ca79" stroke-width="2"/><path d="M-8-42L9-22M8-42L-9-22M-11-27L-5-33M5-33L11-27" stroke="#ecd28c" stroke-width="3"/><path d="M-33-62H33M0-62V-80" stroke="#bb9d5d" stroke-width="3"/></g></defs>
<style>.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flare 1.8s ease-in-out infinite alternate}.ember{animation:ember 4s ease-out infinite}.banner{animation:banner 5s ease-in-out infinite alternate}@keyframes flare{to{transform:scale(.85,1.25) skewX(8deg);opacity:.45}}@keyframes ember{from{transform:translateY(0);opacity:.7}to{transform:translate(35px,-160px);opacity:0}}@keyframes banner{to{transform:rotate(4deg) skewX(-3deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.lightning{opacity:.15}}
</style>
