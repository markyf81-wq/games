<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid slice">
<title>Spectral skull, swaying chains and violet mist</title>
<defs><radialGradient id="mist"><stop stop-color="#a149a3" stop-opacity=".23"/><stop offset="1" stop-color="#301129" stop-opacity="0"/></radialGradient><g id="chain" fill="none" stroke="#b28bb9" stroke-width="3"><ellipse rx="8" ry="13"/><ellipse cy="23" rx="5" ry="11"/><ellipse cy="46" rx="8" ry="13"/><ellipse cy="69" rx="5" ry="11"/><ellipse cy="92" rx="8" ry="13"/><ellipse cy="115" rx="5" ry="11"/></g><g id="skull"><path d="M-43 7C-79-72 79-72 43 7L27 18V46H-27V18Z" fill="#80558e" opacity=".2" stroke="#bd8bc9" stroke-width="2"/><path d="M-32-10L-8-3L-17 10L-33 5ZM32-10L8-3L17 10L33 5Z" fill="#d798df" opacity=".65"/><path d="M0 6L-7 21H7ZM-15 30V44M0 30V46M15 30V44" fill="none" stroke="#c89bd2" stroke-width="3"/></g></defs>
<style>.mist{animation:mist 9s ease-in-out infinite alternate}.chain{animation:sway 6s ease-in-out infinite alternate;opacity:.2;transform-box:fill-box;transform-origin:50% 0%}.skull{animation:haunt 6s ease-in-out infinite alternate}@keyframes mist{to{transform:translate(60px,-8px) scale(1.1);opacity:.5}}@keyframes sway{to{transform:rotate(7deg);opacity:.45}}@keyframes haunt{from{transform:translateY(6px);opacity:.35}to{transform:translateY(-9px);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.lightning{opacity:.15}}
</style>
<g class="mist"><ellipse cx="250" cy="140" rx="390" ry="140" fill="url(#mist)"/><ellipse cx="750" cy="100" rx="370" ry="160" fill="url(#mist)"/></g><g transform="translate(160 -10) scale(1.4)"><g class="chain" style="animation-delay:0s"><use href="#chain"/></g></g><g transform="translate(360 -10) scale(1.4)"><g class="chain" style="animation-delay:-2s"><use href="#chain"/></g></g><g transform="translate(640 -10) scale(1.4)"><g class="chain" style="animation-delay:-4s"><use href="#chain"/></g></g><g transform="translate(840 -10) scale(1.4)"><g class="chain" style="animation-delay:-6s"><use href="#chain"/></g></g><g transform="translate(500 125) scale(1.3)"><g class="skull" style="animation-delay:0s"><use href="#skull"/></g></g>
</svg>
