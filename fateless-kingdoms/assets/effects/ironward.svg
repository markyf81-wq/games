<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid slice">
<title>Pulsing magical shields and rotating ward runes</title>
<defs><radialGradient id="ward"><stop stop-color="#8ee8ce" stop-opacity=".2"/><stop offset="1" stop-color="#60baac" stop-opacity="0"/></radialGradient><g id="shield"><path d="M0-65L45-45V2Q42 45 0 66Q-42 45-45 2V-45Z" fill="#397c70" fill-opacity=".08" stroke="#9ee7ce" stroke-width="2"/><path d="M0-50L32-35V0Q31 32 0 49Q-31 32-32 0V-35Z" fill="none" stroke="#9ee7ce" stroke-opacity=".35"/><path d="M0-25L14 0L0 25L-14 0ZM-23 0H23M0-37V37" fill="none" stroke="#c5ffe1" stroke-width="2"/></g><g id="rune" fill="none" stroke="#98dfc8"><circle r="83" stroke-opacity=".3"/><path d="M0-80L8-67H-8ZM80 0L67 8V-8ZM0 80L-8 67H8ZM-80 0L-67-8V8Z" fill="#98dfc8" stroke="none"/></g></defs>
<style>.shield{animation:ward 4s ease-in-out infinite alternate}.rune{animation:orbit 22s linear infinite}.spark{animation:ward 2.5s ease-in-out infinite alternate}@keyframes ward{from{opacity:.25;transform:scale(.96)}to{opacity:.65;transform:scale(1.03)}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.lightning{opacity:.15}}
</style>
<ellipse cx="500" cy="110" rx="500" ry="160" fill="url(#ward)"/><g transform="translate(180 110) scale(0.95)"><g class="shield" style="animation-delay:0.0s"><use href="#shield"/></g></g><g transform="translate(500 110) scale(0.95)"><g class="shield" style="animation-delay:-1.4s"><use href="#shield"/></g></g><g transform="translate(820 110) scale(0.95)"><g class="shield" style="animation-delay:-2.8s"><use href="#shield"/></g></g><g transform="translate(500 110) scale(1)"><g class="rune" style="animation-delay:0s"><use href="#rune"/></g></g><circle class="spark" cx="0" cy="30" r="1" fill="#b9ffe2" style="animation-delay:0.0s"/><circle class="spark" cx="103" cy="77" r="2" fill="#b9ffe2" style="animation-delay:-0.4s"/><circle class="spark" cx="206" cy="124" r="1" fill="#b9ffe2" style="animation-delay:-0.8s"/><circle class="spark" cx="309" cy="171" r="2" fill="#b9ffe2" style="animation-delay:-1.2000000000000002s"/><circle class="spark" cx="412" cy="58" r="1" fill="#b9ffe2" style="animation-delay:-1.6s"/><circle class="spark" cx="515" cy="105" r="2" fill="#b9ffe2" style="animation-delay:-2.0s"/><circle class="spark" cx="618" cy="152" r="1" fill="#b9ffe2" style="animation-delay:-2.4000000000000004s"/><circle class="spark" cx="721" cy="39" r="2" fill="#b9ffe2" style="animation-delay:-2.8000000000000003s"/><circle class="spark" cx="824" cy="86" r="1" fill="#b9ffe2" style="animation-delay:-3.2s"/><circle class="spark" cx="927" cy="133" r="2" fill="#b9ffe2" style="animation-delay:-3.6s"/><circle class="spark" cx="30" cy="180" r="1" fill="#b9ffe2" style="animation-delay:-4.0s"/><circle class="spark" cx="133" cy="67" r="2" fill="#b9ffe2" style="animation-delay:-4.4s"/><circle class="spark" cx="236" cy="114" r="1" fill="#b9ffe2" style="animation-delay:-4.800000000000001s"/><circle class="spark" cx="339" cy="161" r="2" fill="#b9ffe2" style="animation-delay:-5.2s"/>
