<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid slice">
<title>Golden sanctuary rosettes, halos and blessing motes</title>
<defs><radialGradient id="light"><stop stop-color="#fff3ae" stop-opacity=".25"/><stop offset="1" stop-color="#d5bc6b" stop-opacity="0"/></radialGradient><g id="halo" fill="none" stroke="#ead78f"><circle r="70" stroke-width="2"/><circle r="61" stroke-opacity=".4"/><path d="M0-48Q26-17 48 0Q17 26 0 48Q-26 17-48 0Q-17-26 0-48ZM-34-34Q0-26 34-34Q26 0 34 34Q0 26-34 34Q-26 0-34-34Z" stroke-width="1.5"/><circle r="9"/><path d="M0-82V-72M0 72V82M-82 0H-72M72 0H82" stroke-width="4"/></g></defs>
<style>.halo{animation:turn 26s linear infinite}.halo.reverse{animation-direction:reverse}.blessing{animation:bless 5s ease-in-out infinite alternate}.mote{animation:mote 7s ease-in-out infinite alternate}@keyframes turn{to{transform:rotate(360deg)}}@keyframes bless{from{opacity:.3}to{opacity:.65}}@keyframes mote{to{transform:translate(14px,-18px);opacity:.1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.lightning{opacity:.15}}
</style>
